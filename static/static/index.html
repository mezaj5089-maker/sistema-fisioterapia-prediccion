<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KineData - Sistema de Fisioterapia y Predicción</title>
    <!-- CSS Propio -->
    <link rel="stylesheet" href="styles.css">
    <!-- Librerías Externas CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="dashboard-header">
        <h1>Dashboard Clínico de Fisioterapia</h1>
    </div>

    <div class="dashboard-card">
        <h2>Progreso y Recuperación de Pacientes</h2>
        <canvas id="analyticsChart" height="100"></canvas>
    </div>

    <div class="dashboard-card">
        <h2>Modelo Anatómico 3D</h2>
        <div id="threeCanvas" style="width: 100%; height: 300px;"></div>
    </div>

    <!-- JavaScript Propio -->
    <script src="app.js"></script>
</body>
</html>
